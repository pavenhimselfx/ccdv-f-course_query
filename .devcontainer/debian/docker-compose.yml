name: ccdv-f-course-query-development

services:
  dev:
    # Instructions on how to build the image for this service
    build:
      # Use the current directory (.devcontainer) as the build context
      context: .
      # Specify the Dockerfile within the build context
      dockerfile: Dockerfile.debian

    # Define volumes to mount
    volumes:
      # Mount the entire project directory (one level up from .devcontainer)
      # into the /workspace directory inside the container.
      # 'cached' optimizes mount performance on macOS/Windows.
      - ../..:/xyz:cached
      - ccdv-f-course-query-claude:/home/container-user/.claude
      - ccdv-f-course-query-continue:/home/container-user/.continue
      - ccdv-f-course-query-copilot:/home/container-user/.copilot
      - ccdv-f-course-query-gemini:/home/container-user/.gemini
      # - /var/run/docker.sock:/var/run/docker.sock
      # SSH: the actual ~/.ssh template bind and SSH_AUTH_SOCK forwarding live
      # in devcontainer.json's "mounts" (see copy-ssh-files.sh), not here.
    # Command to run when the container starts.
    # 'sleep infinity' keeps the container running indefinitely so VS Code can attach.
    command: sleep infinity

volumes:
  ccdv-f-course-query-claude:
  ccdv-f-course-query-continue:
  ccdv-f-course-query-copilot:
  ccdv-f-course-query-gemini:
